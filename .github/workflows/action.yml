name: buildozer-full-build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3-pip python3-setuptools python3-dev python3-venv \
            openjdk-11-jdk git zip unzip \
            autoconf automake libtool pkg-config \
            libssl-dev libffi-dev \
            libc6-dev libsqlite3-dev libbz2-dev libreadline-dev \
            libncurses5-dev libncursesw5-dev libpng-dev \
            libjpeg-dev libfreetype6-dev libgl1-mesa-dev \
            libgles2-mesa-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            liblzma-dev libgdbm-dev libdb-dev libexpat1-dev \
            libffi-dev liblzma-dev zlib1g-dev libssl-dev

      - name: Upgrade pip and install buildozer + cython
        run: |
          pip3 install --upgrade pip
          pip3 install buildozer cython==0.29.33

      - name: Build APK
        run: buildozer android debug
