name: build apk

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: debug repo
        run: |
          echo "repo root"
          ls -la
          echo "find main file"
          find . -name main.py

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: install deps
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}

      - name: cache buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('**/buildozer.spec') }}

      - name: cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/buildozer.spec') }}

      - name: fix build dir
        run: |
          rm -rf ~/.buildozer/android/app
          mkdir -p ~/.buildozer/android/app
          cp -r . ~/.buildozer/android/app

      - name: build apk
        run: |
          buildozer -v android debug

      - name: show output
        run: |
          ls -la bin || true

      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
